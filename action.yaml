name: actionlint
description: actionlint
author: Shunsuke Suzuki
inputs:
  sparse-checkout:
    required: false
    description: |
      sparse checkout
  actionlint_options:
    required: false
    description: |
      actionlint's command line options such as `-ignore`.
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: changes
      with:
        filters: |
          value:
            - .github/workflows/*.yml
            - .github/workflows/*.yaml
    - if: steps.changes.outputs.value == 'true'
      uses: suzuki-shunsuke/actionlint-action-main@60f81bc46d90656115e471142983a79a26020616 # v0.0.9
      with:
        sparse-checkout: ${{inputs.sparse-checkout}}
        actionlint_options: ${{inputs.actionlint_options}}
      env:
        AQUA_LOG_COLOR: always
